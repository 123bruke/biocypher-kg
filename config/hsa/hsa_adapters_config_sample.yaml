# hsa sample adapters config (connected_full_sample_data branch).
#
# Generated to work with samples/hsa/ files produced by
# scripts/generate_connected_sample.py, which filters the real, full-size
# GENCODE/UniProt/STRING/coxpresdb/TFLink/GAF data down to an ego-network
# closure around the anchor genes in config/hsa/hsa_anchor_genes.yaml (see
# docs/knowledge-graph/sample-generation.md for the full algorithm and rationale).
# This is the config used by both --dataset sample and test/conftest.py.
#
# Deferred (no real sample data available, or resolves via a different path
# than the adapters already included): ENCODE, uniprot_dbxref_bgee_gene.

input_dir: samples/hsa

gencode_gene:
  adapter:
    module: biocypher_metta.adapters.gencode_gene_adapter
    cls: GencodeGeneAdapter
    args:
      filepath: ensembl/gencode.gtf.gz
      label: gene
      taxon_id: 9606
  outdir: ensembl/gene
  nodes: True
  edges: False

gencode_transcripts:
  adapter:
    module: biocypher_metta.adapters.gencode_transcript_adapter
