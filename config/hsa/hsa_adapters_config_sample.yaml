      # scoping gap, not a UniProt data-availability gap. This points at a
      # synthetic single-record file instead (see
      # write_synthetic_uniprot_chebi_part_of in generate_connected_sample.py)
      # instead of the shared real uniprot_sprot_human.dat.gz every other
      # uniprot_* adapter reads.
      filepath: uniprot/chebi_part_of_synthetic.dat.gz
      label: chemical_substance_part_of_chemical_substance
      taxon_id: 9606
