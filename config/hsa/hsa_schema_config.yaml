Title: BioCypher graph schema configuration file
# ---
# "Named Things"
# ---

#parent types
chromosome:
  represented_as: node
  is_a: position entity
  mixins: [biolink:GenomicEntity]
  biolink_category: "biolink:GenomicEntity"
  inherit_properties: true
  input_label: chromosome
  properties:
    chromosome_id: 
      type: str

# non coding elements

super enhancer:
  represented_as: node
  input_label: super_enhancer
  is_a: non coding element
  mixins: [biolink:RegulatoryRegion]
  biolink_category: "biolink:RegulatoryRegion"
  inherit_properties: true
  properties:
    se_id:
      type: str
      biolink: id
    taxon_id:
      description: Taxon ID for the organism (e.g., 7227 for fruit fly, 9606 for human)
      type: int
      biolink: taxon
      range: biolink:OrganismTaxon
  kgx_properties:
    category: "biolink:RegulatoryRegion"

hsapdv subclass of:
  is_a: subclass of
  inherit_properties: true
  represented_as: edge
  input_label: hsapdv_subclass_of
  output_label: is_a
  biolink_predicate: "biolink:subclass_of"
  source: developmental stage
  target: developmental stage
  kgx_properties:
    subject_category: "biolink:LifeStage"
    object_category: "biolink:LifeStage"
    knowledge_level: "knowledge_assertion"
    agent_type: "manual_agent"

omim subclass of:
  is_a: subclass of
  inherit_properties: true
  represented_as: edge
  input_label: omim_subclass_of
  output_label: is_a
  biolink_predicate: "biolink:subclass_of"
  source: disease
  target: disease
  kgx_properties:
    subject_category: "biolink:Disease"
    object_category: "biolink:Disease"
    knowledge_level: "knowledge_assertion"
    agent_type: "manual_agent"

#chebi
transcribed from:
  is_a: expression
  mixins: [biolink:TranscriptToGeneRelationship]
  biolink_predicate: "biolink:transcribed_from"
  inherit_properties: true
  represented_as: edge
  input_label: transcribed_from
  source: transcript
  target: gene
  kgx_properties:
    subject_category: "biolink:Transcript"
    object_category: "biolink:Gene"
    knowledge_level: "knowledge_assertion"
    agent_type: "manual_agent"
  description: >-
    x is transcribed from y if and only if x is synthesized from template y
  exact_mappings:
    - RO:0002510
    - SIO:010081

translation of:
  is_a: expression
  biolink_predicate: "biolink:translation_of"
  inherit_properties: true
  represented_as: edge
  input_label: translation_of
  source: protein
  target: transcript
  kgx_properties:
    subject_category: "biolink:Protein"
    object_category: "biolink:Transcript"
    knowledge_level: "knowledge_assertion"
    agent_type: "manual_agent"
  description: >-
    inverse of translates to
  inverse: translates to
  close_mappings:
    - RO:0002512
    - SIO:010083

protein to protein coexpression association:
  description: >-
    Indicates that two proteins are co-expressed,
    generally under the same conditions, as measured
    at the protein/transcript level (e.g. STRING coexpression channel).
  is_a: expression
  biolink_predicate: "biolink:coexpressed_with"
  inherit_properties: true
  represented_as: edge
  input_label: protein_coexpressed_with
  output_label: coexpressed_with
  source: protein
  target: protein
  kgx_properties:
    subject_category: "biolink:Protein"
    object_category: "biolink:Protein"
    knowledge_level: "knowledge_assertion"
    agent_type: "automated_agent"
  properties:
    coexpression_score:
      type: float
      biolink: has_quantitative_value

# There is no data for this.
reaction_to_molecular_function:
    is_a: association
    source: reaction
    target: molecular function
    biolink_predicate: "biolink:related_to"
    represented_as: edge
    input_label: reaction_to_molecular_function
    description: >-
      An association between a reaction and a molecular function, indicating that the reaction is involved in the function.
    properties: {}
    kgx_properties:
      subject_category: "biolink:MolecularActivity"
      object_category: "biolink:MolecularActivity"
      knowledge_level: "knowledge_assertion"
      agent_type: "manual_agent"

enhancer accessible in cell type:
  description: >-
    An enhancer shows open chromatin in a cell type (CL term) as profiled by
    scATAC-seq in the CATLAS dataset.
  is_a: regulatory association
  biolink_predicate: "biolink:related_to"
  inherit_properties: true
  represented_as: edge
  input_label: enhancer_accessible_in_cell_type
  output_label: accessible_in
  source: enhancer
  target: cell type
  kgx_properties:
    subject_category: "biolink:RegulatoryRegion"
    object_category: "biolink:Cell"
    knowledge_level: "knowledge_assertion"
    agent_type: "manual_agent"

enhancer accessible in tissue:
  description: >-
    An enhancer shows open chromatin in a tissue (UBERON term) as profiled by
    scATAC-seq in the CATLAS dataset.
  is_a: regulatory association
  biolink_predicate: "biolink:related_to"
  inherit_properties: true
  represented_as: edge
  input_label: enhancer_accessible_in_tissue
  output_label: accessible_in
  source: enhancer
  target: anatomy
  kgx_properties:
    subject_category: "biolink:RegulatoryRegion"
    object_category: "biolink:AnatomicalEntity"
    knowledge_level: "knowledge_assertion"
    agent_type: "manual_agent"

promoter accessible in cell type:
  description: >-
    A promoter shows open chromatin in a cell type (CL term) as profiled by
    scATAC-seq in the CATLAS dataset.
  is_a: regulatory association
  biolink_predicate: "biolink:related_to"
  inherit_properties: true
  represented_as: edge
  input_label: promoter_accessible_in_cell_type
  output_label: accessible_in
  source: promoter
  target: cell type
  kgx_properties:
    subject_category: "biolink:RegulatoryRegion"
    object_category: "biolink:Cell"
    knowledge_level: "knowledge_assertion"
    agent_type: "manual_agent"

promoter accessible in tissue:
  description: >-
    A promoter shows open chromatin in a tissue (UBERON term) as profiled by
    scATAC-seq in the CATLAS dataset.
  is_a: regulatory association
  biolink_predicate: "biolink:related_to"
  inherit_properties: true
  represented_as: edge
  input_label: promoter_accessible_in_tissue
  output_label: accessible_in
  source: promoter
  target: anatomy
  kgx_properties:
    subject_category: "biolink:RegulatoryRegion"
    object_category: "biolink:AnatomicalEntity"
    knowledge_level: "knowledge_assertion"
    agent_type: "manual_agent"

gtex variant to gene expression association:
  aliases: ["eQTL", "e-QTL"]
  description: >-
    An association between a variant and expression of a gene (i.e. e-QTL)
  is_a: association
  mixins: [biolink:VariantToGeneExpressionAssociation]
  biolink_predicate: "biolink:correlated_with"
  represented_as: edge
  input_label: gtex_variant_gene
  output_label: eqtl_association
  source: snp
  target: gene
  kgx_properties:
    subject_category: "biolink:Snv"
    object_category: "biolink:Gene"
    knowledge_level: "knowledge_assertion"
    agent_type: "manual_agent"
  properties:
    slope: float
    maf: float
    p_value: float
    q_value: float
    biological_context: str
    source: str
    source_url: str

closest gene to variant association:
  is_a: association
  mixins: [biolink:VariantToGeneAssociation]
  biolink_predicate: "biolink:associated_with" 
  description: >-
    holds between a sequence variant and a gene that is closest to the variant
  represented_as: edge
  input_label: closest_gene
  source: snp
  target: gene
  kgx_properties:
    subject_category: "biolink:Snv"
    object_category: "biolink:Gene"
    knowledge_level: "knowledge_assertion"
    agent_type: "manual_agent"
  properties:
    chr: 
      type: str
    pos: 
      type: int
      biolink: start_interbase_coordinate
    distance: 
      type: int
    source: 
      type: str
      biolink: provided_by
    source_url: 
      type: str
      biolink: source_web_page

upstream gene to variant association:
  is_a: closest gene to variant association
  mixins: [biolink:VariantToGeneAssociation]
  biolink_predicate: "biolink:associated_with"
  inherit_properties: true
  description: >-
    holds between a sequence variant and a gene that is upstream to the variant
  represented_as: edge
  input_label: snp_upstream_gene
  output_label: upstream_of
  source: snp
  target: gene
  kgx_properties:
    subject_category: "biolink:Snv"
    object_category: "biolink:Gene"
    knowledge_level: "knowledge_assertion"
    agent_type: "manual_agent"
  properties:
    distance: 
      type: int
    p_value: 
      type: float
      biolink: has_quantitative_value

downstream gene to variant association:
  is_a: closest gene to variant association
  mixins: [biolink:VariantToGeneAssociation]
  biolink_predicate: "biolink:associated_with"
  inherit_properties: true
  description: >-
    holds between a sequence variant and a gene that is downstream to the variant
  represented_as: edge
  input_label: snp_downstream_gene
  output_label: downstream_of
  source: snp
  target: gene
  kgx_properties:
    subject_category: "biolink:Snv"
    object_category: "biolink:Gene"
    knowledge_level: "knowledge_assertion"
    agent_type: "manual_agent"
  properties:
    distance: 
      type: int
    p_value: 
      type: float
      biolink: has_quantitative_value

topld in linkage disequilibrium with:
  is_a: association
  biolink_predicate: "biolink:in_linkage_disequilibrium_with"
  description:
    holds between two sequence variants, the presence of which are correlated
    in a population
  represented_as: edge
  input_label: in_linkage_disequilibrium_with
  source: snp
  target: snp
  kgx_properties:
    subject_category: "biolink:Snv"
    object_category: "biolink:Snv"
    knowledge_level: "knowledge_assertion"
    agent_type: "manual_agent"
  properties:
    ancestry: 
      type: str
    r2: 
      type: float
      biolink: has_quantitative_value
    d_prime: 
      type: float
      biolink: has_quantitative_value
    source: 
      type: str
      biolink: provided_by
    source_url: 
      type: str
      biolink: source_web_page

lower resolution structure:
  is_a: association
  mixins: [biolink:GenomicSequenceLocalization]
  biolink_predicate: "biolink:has_part"
  description: >-
    holds between two chromosome chains where one is a lower resolution version of the other
  represented_as: edge
  input_label: lower_resolution
  source: chromosome_chain
  target: chromosome_chain
  kgx_properties:
    subject_category: "biolink:GenomicEntity"
    object_category: "biolink:GenomicEntity"
    knowledge_level: "knowledge_assertion"
    agent_type: "manual_agent"

located on chain:
  is_a: association
  mixins: [biolink:GenomicSequenceLocalization]
  biolink_predicate: "biolink:part_of"
  description: >-
    holds between a position entity and a chromosome chain
  represented_as: edge
  input_label: located_on_chain
  source: position_entity
  target: chromosome_chain
  kgx_properties:
    subject_category: "biolink:GenomicEntity"
    object_category: "biolink:GenomicEntity"
    knowledge_level: "knowledge_assertion"
    agent_type: "manual_agent"

activity by contact:
  description: >-
    An association between a variant in a regulatory region and a gene predicted
    by the ABC model (Fulco et al. 2019)
  is_a: regulatory association
  mixins: [biolink:VariantToGeneAssociation]
  biolink_predicate: "biolink:affects"
  inherit_properties: true
  represented_as: edge
  input_label: activity_by_contact
  source: snp
  target: gene
  kgx_properties:
    subject_category: "biolink:Snv"
    object_category: "biolink:Gene"
    knowledge_level: "knowledge_assertion"
    agent_type: "manual_agent"
  properties:
    score:
      type: float
      biolink: has_quantitative_value
    biological_context:
      type: str
      biolink: has_biological_sequence
    taxon_id:
      type: int
      biolink: taxon
      range: biolink:OrganismTaxon

enhancer activity by contact:
  description: >-
    An association between an enhancer cCRE and a gene predicted by the
    ABC model (Activity-By-Contact, Fulco et al. 2019) using CATLAS single-cell
    chromatin accessibility data, or by ENCODE rE2G.
  is_a: regulatory association
  mixins: [biolink:association]
  biolink_predicate: "biolink:affects"
  inherit_properties: true
  represented_as: edge
  input_label: enhancer_activity_by_contact
  output_label: activity_by_contact
  source: enhancer
  target: gene
  kgx_properties:
    subject_category: "biolink:RegulatoryRegion"
    object_category: "biolink:Gene"
    knowledge_level: "knowledge_assertion"
    agent_type: "manual_agent"
  properties:
    abc_score:
      type: float
      biolink: has_quantitative_value
    score:
      type: float
      biolink: has_quantitative_value
    distance:
      type: int
      biolink: has_quantitative_value
    biological_context:
      type: str
      biolink: has_biological_sequence
    taxon_id:
      type: str
      description: Taxon ID for the organism (e.g., 9606 for human)

